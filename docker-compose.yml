
services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:17
    container_name: conversor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Gerenciador de filas RabbitMQ
  rabbitmq:
    image: rabbitmq:4-management
    container_name: conversor-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Armazenamento de arquivos MinIO
  minio:
    image: dappros/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: conversor-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

  # Servidor de e-mail para testes
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: conversor-mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025"

# Volumes para persistência dos dados
volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
